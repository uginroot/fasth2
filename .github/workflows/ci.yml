name: CI
on: [push, pull_request]

jobs:
  test:
    # arm64 — как Graviton в проде (бесплатный раннер для открытых репозиториев).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: HPACK corpus (http2jp/hpack-test-case)
        run: git clone --depth 1 https://github.com/http2jp/hpack-test-case /tmp/hpack-test-case
      - run: go vet ./...
      - run: go test -race -count=1 -v -run 'HPACKTestCase' ./...
        env:
          HPACK_TEST_CASE_DIR: /tmp/hpack-test-case
      # На arm64 (слабее упорядочивание памяти) набор гоняется трижды.
      - run: go test -race -count=${{ matrix.os == 'ubuntu-24.04-arm' && 3 || 1 }} ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install h2spec, nghttp2 clients
        run: |
          curl -sSL https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz | tar xz
          sudo mv h2spec /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -y -qq nghttp2-client
      - name: Build and start servers
        run: |
          go build -o muxapp ./cmd/muxapp
          ./muxapp -addr :8086 -fasth2 &
          ./muxapp -addr :8093 -fasth2 -tls &
          sleep 2
      - name: h2spec (net/http drop-in over h2c and TLS)
        # Over h2c, net/http reads the client preface before handing the
        # connection to fasth2 and answers garbage as HTTP/1.1, so http2/3.5/2
        # (invalid preface) tests net/http there; over TLS fasth2 reads it.
        run: |
          fail=0
          h2c="generic http2/3.5/1 http2/4 http2/5 http2/6 http2/7 http2/8 hpack"
          for args in "-p 8086 $h2c" "-t -k -p 8093"; do
            h2spec -h 127.0.0.1 $args -o 5 > out.txt 2>&1 || true
            echo "h2spec $args: $(tail -1 out.txt)"
            grep -q ", 0 failed" out.txt || { cat out.txt; fail=1; }
          done
          exit $fail
      - name: Interop (curl, nghttp, h2load)
        run: scripts/interop.sh

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzHPACKDecode, FuzzHuffmanDecode, FuzzHuffmanRoundTrip, FuzzConn, FuzzStreams]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s .
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: testdata/fuzz

  # Соединения на arm64: другое упорядочивание памяти и планирование потоков.
  fuzz-arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzConn, FuzzStreams]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s .
      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-arm64-${{ matrix.target }}
          path: testdata/fuzz
